plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

android {
    namespace 'com.wilson.hymnbook'
    compileSdk 34

    // Fixed debug keystore so every build shares one signing certificate: an update then
    // installs straight over the previous build instead of failing with
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE. DEBUG ONLY - never sign a release with this key.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.wilson.hymnbook"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    configurations.all {
        resolutionStrategy {
            // keep a single Kotlin stdlib (newest wins) so duplicate-class checks pass
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // tesseract-android-lib (JitPack: adaptech-cz/Tesseract4Android)
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}

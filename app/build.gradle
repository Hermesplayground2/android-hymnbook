plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wilson.hymnbook'
    compileSdk 34

    defaultConfig {
        applicationId "com.wilson.hymnbook"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // tesseract-android-lib (JitPack: adaptech-cz/Tesseract4Android)
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}

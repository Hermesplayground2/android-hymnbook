name: Build Android APK (Hymbook)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Install Android SDK + needed packages
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          # download the new cmdline-tools toolchain (ships a working sdkmanager);
          # platform-tools comes from the runner's preinstalled path.
          if [ ! -x "${ANDROID_HOME}/cmdline-tools/12266719/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
            rm -rf "${ANDROID_HOME}/cmdline-tools"
            mkdir -p "${ANDROID_HOME}/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
            mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/12266719"
            rm -f /tmp/cmdline-tools.zip
          fi
          export PATH="${ANDROID_HOME}/cmdline-tools/12266719/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          # accept every SDK license ('y' to each prompt; the --licenses CHECK returns
          # non-zero on an incomplete SDK, so swallow that exit code)
          (yes | sdkmanager --licenses) >/dev/null 2>&1 || true
          # install exactly what the app needs (already-installed ones are skipped)
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-build-cache --refresh-dependencies --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-hymnbook-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload full APK directory
        uses: actions/upload-artifact@v4
        with:
          name: android-hymnbook-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
